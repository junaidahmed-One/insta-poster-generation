[project]
name = "poster-gen"
version = "0.1.0"
description = "Code-rendered social posters in the editorial collage style"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.1",
    "pillow>=11.0",
]

[project.scripts]
poster = "poster_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poster_gen"]
